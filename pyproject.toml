[project]
name = "trueo-market-discovery-example"
version = "0.1.0"
description = "Example: draft prediction-market candidates in Trueo's format from the Fortuna social data API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.51.0",
    "pydantic>=2.14.3",
]

[project.scripts]
trueo-discover = "trueo_market_discovery.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trueo_market_discovery"
